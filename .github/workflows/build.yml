name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:  
      - name: Checkout  
        uses: actions/checkout@v4  

      - name: Setup Node & Java
        uses: actions/setup-node@v4  
        with:
          node-version: 20  
      - uses: actions/setup-java@v4  
        with:  
          distribution: 'temurin'  
          java-version: '21'  

      - name: Install All Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor-community/voice-recorder

      - name: Build Web Project  
        run: npm run build  

      - name: Init & Add Android
        run: |
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then  
            npx cap init jarvis com.jarvis.app --web-dir=dist  
          fi
          npx cap add android || echo "Already exists"
          npx cap sync android

      - name: 🛡️ Inject All Android Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            # 1. Microphone & Audio
            sed -i '/<application/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" />' $MANIFEST
            sed -i '/<application/i \    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' $MANIFEST
            
            # 2. Storage (Read/Write)
            sed -i '/<application/i \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />' $MANIFEST
            sed -i '/<application/i \    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />' $MANIFEST
            
            # 3. Location (Jarvis ko weather/map ke liye chahiye hogi)
            sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' $MANIFEST
            sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' $MANIFEST
            
            # 4. Camera (Face recognition ya vision ke liye)
            sed -i '/<application/i \    <uses-permission android:name="android.permission.CAMERA" />' $MANIFEST
            
            # 5. Internet & Network State
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />' $MANIFEST
            sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' $MANIFEST
            
            # 6. Notifications
            sed -i '/<application/i \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' $MANIFEST

            # Hardware Features (Jarvis ko pata hona chahiye mic/camera hai)
            sed -i '/<application/i \    <uses-feature android:name="android.hardware.microphone" android:required="false" />' $MANIFEST
            sed -i '/<application/i \    <uses-feature android:name="android.hardware.camera" android:required="false" />' $MANIFEST
            
            echo "All essential permissions injected!"
          fi

      - name: Fix Gradle Build Issues
        run: |  
          echo "configurations.all { exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'; exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8' }" >> android/build.gradle
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

      - name: Build Debug APK  
        run: |  
          cd android  
          chmod +x gradlew  
          ./gradlew assembleDebug --no-daemon  

      - name: Upload APK Artifact  
        uses: actions/upload-artifact@v4  
        with:  
          name: jarvis-apk  
          path: android/app/build/outputs/apk/debug/app-debug.apk
