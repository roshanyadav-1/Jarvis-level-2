name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build Web Project
        run: npm run build

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Init Capacitor (only if missing)
        run: |
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            npx cap init jarvis com.jarvis.app --web-dir=dist
          fi

      - name: Add Android Platform
        run: npx cap add android || echo "Android already added"

      - name: Copy Web Assets to Android
        run: npx cap copy android

      - name: Ultimate Fix for Duplicate Classes
        run: |
          # Sabse pehle android/build.gradle mein configuration block add karna
          cat <<EOT >> android/build.gradle
          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOT
          
          # App level build.gradle mein bhi exclusion daalna
          if [ -f android/app/build.gradle ]; then
            echo "configurations.all { exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'; exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8' }" >> android/app/build.gradle
          fi

      - name: Configure Gradle Properties
        run: |
          mkdir -p android
          echo "org.gradle.jvmargs=-Xmx2048m" > android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "kotlin.code.style=official" >> android/gradle.properties
          echo "android.nonTransitiveRClass=false" >> android/gradle.properties

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

          
